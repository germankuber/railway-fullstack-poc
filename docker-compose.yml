services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: ./apps/api
    command: ["--migrate"]
    environment:
      DATABASE_URL: postgresql://todo:todo@postgres:5432/todo
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://todo:todo@postgres:5432/todo
      WEB_ORIGIN: http://localhost:5173
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:8080
    environment:
      PORT: "5173"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            path: apps/api
            url_variable: API_URL
            health_path: /health
          - service: web
            path: apps/web
            url_variable: WEB_URL
            health_path: /
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @railway/cli
      - name: Deploy to Railway
        run: >
          railway up ${{ matrix.path }}
          --path-as-root
          --service ${{ matrix.service }}
          --ci
          --message "${{ github.sha }}"
      - name: Wait for deployment to become healthy on Railway
        run: .github/scripts/wait-for-railway-deployment.sh ${{ matrix.service }} ${{ github.sha }} 600
      - name: Smoke test public endpoint
        run: .github/scripts/check-health.sh "${{ vars[matrix.url_variable] }}${{ matrix.health_path }}"
